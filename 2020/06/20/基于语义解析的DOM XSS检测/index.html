  <div class="article-content" itemprop="articleBody"><h2 id="使用acorn"><a href="#使用acorn" class="headerlink" title="使用acorn"></a>使用acorn</h2><p>acorn是javascript的一个语法树生成工具，默认不显示行号，添加参数即可。</p>

  <script>
    (function () {
      var terminal = document.querySelector('[data-terminal-intro]');
      var reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      if (!terminal || reduceMotion) return;

      var introSeen = false;
      try { introSeen = window.sessionStorage.getItem('deen-terminal-intro-seen') === '1'; } catch (error) {}
      if (introSeen) return;
      try { window.sessionStorage.setItem('deen-terminal-intro-seen', '1'); } catch (error) {}

      var root = document.documentElement;
      var lines = terminal.querySelectorAll('.terminal-command .terminal-typed');
      var output = terminal.querySelector('.terminal-output');
      var cursors = terminal.querySelectorAll('.terminal-cursor');
      var list = document.querySelector('.post-list');
      var pagination = document.querySelector('.terminal-status');
      var text = Array.prototype.map.call(lines, function (line) { return line.textContent; });
      var delay = function (milliseconds) { return new Promise(function (resolve) { window.setTimeout(resolve, milliseconds); }); };
      var type = function (line, value) {
        line.textContent = '';
        return new Promise(function (resolve) {
          var index = 0;
          var tick = function () {
            line.textContent += value.charAt(index++);
            if (index < value.length) window.setTimeout(tick, 28);
            else resolve();
          };
          tick();
        });
      };

      root.classList.add('terminal-booting');
      cursors[0].classList.add('is-active');
      output.classList.remove('is-visible');
      type(lines[0], text[0])
        .then(function () {
          cursors[0].classList.remove('is-active');
          output.classList.add('is-visible');
          return delay(260);
        })
        .then(function () { cursors[1].classList.add('is-active'); })
        .then(function () { return type(lines[1], text[1]); })
        .then(function () {
          cursors[1].classList.remove('is-active');
          Array.prototype.forEach.call(list.children, function (item, index) {
            item.style.transitionDelay = (index * 42) + 'ms';
            item.classList.add('is-visible');
          });
          if (pagination) pagination.classList.add('is-visible');
          root.classList.remove('terminal-booting');
        });
    }());

    document.querySelectorAll('.article-content .highlight').forEach(function (block) {
      var code = block.querySelector('code, td.code, pre');
      if (!code) return;
      var className = block.className.split(/\s+/).find(function (name) { return name !== 'highlight'; });
      var toolbar = document.createElement('div');
      toolbar.className = 'code-toolbar';
      toolbar.innerHTML = '<span class="code-controls" aria-hidden="true"><i></i><i></i><i></i></span><span class="code-language"></span><button type="button" data-copy-code>Copy</button>';
      toolbar.querySelector('.code-language').textContent = className || 'text';
      block.prepend(toolbar);
      var table = block.querySelector('table');
      if (table) {
        var scroller = document.createElement('div');
        scroller.className = 'code-scroll';
        table.parentNode.insertBefore(scroller, table);
        scroller.appendChild(table);
      }
    });
    document.addEventListener('click', function (event) {
      var button = event.target.closest('[data-copy-code]');
      if (!button) return;
      var code = button.closest('.highlight, .code-block').querySelector('code, td.code, pre');
      if (!code || !navigator.clipboard) return;
      navigator.clipboard.writeText(code.innerText).then(function () {
        button.textContent = 'Copied';
        window.setTimeout(function () { button.textContent = 'Copy'; }, 1400);
      });
    });
  </script><!-- hexo-inject:begin --><!-- hexo-inject:end -->
